  <!-- Early System Theme Detection -->
  <script>
    (function() {
      try {
        localStorage.removeItem('localhostusak_theme');
        localStorage.removeItem('localhostusak_theme_manual');
        var manual = sessionStorage.getItem('localhostusak_theme_manual');
        var saved = sessionStorage.getItem('localhostusak_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (manual === 'true' && saved) ? saved : (prefersDark ? 'modern' : 'pixel');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
