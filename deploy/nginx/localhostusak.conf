# ==============================================================================
# localhostusak — Nginx Production Konfigürasyonu
# Konum: /etc/nginx/sites-available/localhostusak.conf
# Aktifleştirme: sudo ln -s /etc/nginx/sites-available/localhostusak.conf /etc/nginx/sites-enabled/
# ==============================================================================

# API Rate Limiting Zone (IP başına saniyede maks 20 istek, 30 burst toleransı)
limit_req_zone $binary_remote_addr zone=cms_api_limit:10m rate=20r/s;

# ------------------------------------------------------------------------------
# 1. www -> non-www 301 Yönlendirmesi
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.localhostusak.tech www.localhostusak.com;
    return 301 https://localhostusak.tech$request_uri;
}

# ------------------------------------------------------------------------------
# 2. Ana Sunucu Bloğu (localhostusak.tech & localhostusak.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhostusak.tech localhostusak.com;

    # Klasör yönlendirmelerinde (örn: /etkinlikler -> /etkinlikler/) http yerine göreceli konum kullanarak
    # HTTPS protokolünün bozulmasını ve Google Search Console yönlendirme hatalarını önler:
    absolute_redirect off;

    # SSL sertifikası Certbot tarafından eklenecektir:
    # sudo certbot --nginx -d localhostusak.com -d www.localhostusak.com

    # --------------------------------------------------------------------------
    # Güvenlik & Performans Başlıkları
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # İstemci yükleme boyutu (Medya yüklemeleri için 25MB)
    client_max_body_size 25M;

    # Proxy Zaman Aşımı Ayarları
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # --------------------------------------------------------------------------
    # Payload CMS v3 (Port 3000 — Node / PM2)
    # --------------------------------------------------------------------------
    
    # Payload Admin Paneli
    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Payload CMS (Next.js) Statik Dosyaları (1 Yıl Değişmez Önbellekleme)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Payload CMS (Next.js) Dahili Asset ve Scriptleri (/admin için zorunlu)
    location /_next {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Payload REST & GraphQL API (Rate limit korumalı)
    location /api {
        limit_req zone=cms_api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Payload Medya / Yüklenen Görseller
    location /media {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # Vite React 19 Frontend SPA (Statik Dosyalar)
    # --------------------------------------------------------------------------
    root /var/www/localhostusak/localhostusak-web/dist;
    index index.html;

    # Statik asset dosyaları için uzun vadeli önbellekleme (1 Yıl)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA Fallback — Tüm sayfa yenilemelerinde (F5) 404 önleyici
    location / {
        try_files $uri $uri/ /index.html;
    }

    # robots.txt ve sitemap.xml doğrudan servis edilir
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        log_not_found off;
        access_log off;
    }
}
