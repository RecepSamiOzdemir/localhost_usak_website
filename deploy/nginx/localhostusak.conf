# ==============================================================================
# localhostusak — Nginx Production Konfigürasyonu
# Konum: /etc/nginx/sites-available/localhostusak.conf
# Aktifleştirme: sudo ln -s /etc/nginx/sites-available/localhostusak.conf /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhostusak.com www.localhostusak.com;

    # SSL sertifikası Certbot tarafından eklenecektir (sudo certbot --nginx)
    # Certbot bu bloğu otomatik olarak HTTPS'e yönlendirecektir.

    # --------------------------------------------------------------------------
    # 1. Güvenlik & Performans Başlıkları
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # İstemci yükleme boyutu (Medya yüklemeleri için 25MB)
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # 2. Payload CMS v3 (Port 3000 — Node / PM2)
    #    Admin Paneli, REST API ve Medya Dosyaları
    # --------------------------------------------------------------------------
    
    # Payload Admin Paneli
    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Payload REST & GraphQL API
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Payload Medya / Yüklenen Görseller
    location /media {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # 3. Vite React 19 Frontend SPA (Statik Dosyalar)
    # --------------------------------------------------------------------------
    root /var/www/localhostusak/localhostusak-web/dist;
    index index.html;

    # Statik asset dosyaları için uzun vadeli önbellekleme (1 Yıl)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA Fallback — Tüm sayfa yenilemelerinde (F5) 404 önleyici
    location / {
        try_files $uri $uri/ /index.html;
    }

    # robots.txt ve sitemap.xml doğrudan servis edilir
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        log_not_found off;
        access_log off;
    }
}
